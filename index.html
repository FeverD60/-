<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>中国地图数据可视化系统</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.bootcdn.net/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <script src="https://cdn.bootcdn.net/ajax/libs/echarts/5.4.3/echarts.min.js"></script>
    <script src="https://cdn.bootcdn.net/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#165DFF',
                        success: '#00B42A',
                        warning: '#FF7D00',
                        danger: '#F53F3F',
                        dark: '#1D2129',
                        light: '#F2F3F5'
                    },
                    fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] }
                }
            }
        }
    </script>

    <style type="text/tailwindcss">
        @layer utilities {
            .content-auto { content-visibility: auto; }
            .map-container { height: calc(100vh - 200px); min-height: 600px; }
            .card-shadow { box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08); }
            .hover-lift { transition: transform 0.3s ease, box-shadow 0.3s ease; }
            .hover-lift:hover { transform: translateY(-5px); box-shadow: 0 8px 30px rgba(0, 0, 0.12); }
        }
    </style>
</head>
<body class="bg-gray-50 font-sans text-dark">
    <header class="bg-white shadow-md sticky top-0 z-50">
        <div class="container mx-auto px-4 py-4 flex justify-between items-center">
            <div class="flex items-center space-x-2">
                <i class="fa fa-map-marker text-primary text-2xl"></i>
                <h1 class="text-[clamp(1.2rem,3vw,1.8rem)] font-bold text-primary">中国地图数据可视化系统</h1>
            </div>
            <div class="flex items-center space-x-4">
                <button id="refreshBtn" class="bg-primary hover:bg-primary/90 text-white px-4 py-2 rounded-lg flex items-center transition duration-300">
                    <i class="fa fa-refresh mr-2"></i><span>刷新数据</span>
                </button>
                <button id="helpBtn" class="bg-white border border-gray-300 hover:bg-gray-100 px-4 py-2 rounded-lg flex items-center transition duration-300">
                    <i class="fa fa-question-circle mr-2"></i><span>帮助</span>
                </button>
            </div>
        </div>
    </header>
    <main class="container mx-auto px-4 py-6">
        <!-- 统计卡片 -->
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 mb-8">
            <div class="bg-white rounded-xl p-6 card-shadow hover-lift">
                <div class="flex justify-between items-start mb-4">
                    <div>
                        <p class="text-gray-500 text-lg">总中心数量</p>
                        <h3 id="totalCenters" class="text-3xl font-bold mt-2">0</h3>
                    </div>
                    <div class="w-12 h-12 bg-primary/10 rounded-full flex items-center justify-center text-primary">
                        <i class="fa fa-hospital-o text-xl"></i>
                    </div>
                </div>
                <div class="flex items-center text-sm text-gray-500"><i class="fa fa-info-circle mr-2"></i><span>当前监控的医疗中心总数</span></div>
            </div>
            <div class="bg-white rounded-xl p-6 card-shadow hover-lift">
                <div class="flex justify-between items-start mb-4">
                    <div>
                        <p class="text-gray-500 text-lg">总入组人数</p>
                        <h3 id="totalEnrollment" class="text-3xl font-bold mt-2">0</h3>
                    </div>
                    <div class="w-12 h-12 bg-success/10 rounded-full flex items-center justify-center text-success">
                        <i class="fa fa-users text-xl"></i>
                    </div>
                </div>
                <div class="flex items-center text-sm text-gray-500"><i class="fa fa-info-circle mr-2"></i><span>所有中心累计入组人数</span></div>
            </div>
            <div class="bg-white rounded-xl p-6 card-shadow hover-lift">
                <div class="flex justify-between items-start mb-4">
                    <div>
                        <p class="text-gray-500 text-lg">今日入组人数</p>
                        <h3 id="todayEnrollment" class="text-3xl font-bold mt-2">0</h3>
                    </div>
                    <div class="w-12 h-12 bg-warning/10 rounded-full flex items-center justify-center text-warning">
                        <i class="fa fa-calendar-check-o text-xl"></i>
                    </div>
                </div>
                <div class="flex items-center text-sm text-gray-500"><i class="fa fa-info-circle mr-2"></i><span>所有中心今日新增入组人数</span></div>
            </div>
            <div class="bg-white rounded-xl p-6 card-shadow hover-lift">
                <div class="flex justify-between items-start mb-4">
                    <div>
                        <p class="text-gray-500 text-lg">警报数量</p>
                        <h3 id="alertCount" class="text-3xl font-bold mt-2 text-danger">0</h3>
                    </div>
                    <div class="w-12 h-12 bg-danger/10 rounded-full flex items-center justify-center text-danger">
                        <i class="fa fa-exclamation-triangle text-xl"></i>
                    </div>
                </div>
                <div class="flex items-center text-sm text-gray-500"><i class="fa fa-info-circle mr-2"></i><span>当前需要处理的警报数量</span></div>
            </div>
        </div>
        <!-- 主内容区域 -->
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <div class="lg:col-span-2 bg-white rounded-xl p-6 card-shadow">
                <div class="flex justify-between items-center mb-6">
                    <h2 class="text-xl font-bold">中国地图数据分布</h2>
                    <div class="flex space-x-4">
                        <div class="relative">
                            <select id="dataTypeSelect" class="appearance-none bg-gray-100 border border-gray-300 rounded-lg py-2 pl-4 pr-10 focus:outline-none focus:ring-2 focus:ring-primary/50">
                                <option value="totalEnrollment">按总入组人数</option>
                                <option value="todayEnrollment">按今日入组人数</option>
                                <option value="centerCount">按中心数量</option>
                            </select>
                            <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-2 text-gray-700"><i class="fa fa-chevron-down text-xs"></i></div>
                        </div>
                        <button id="zoomInBtn" class="bg-gray-100 hover:bg-gray-200 p-2 rounded-lg transition duration-300"><i class="fa fa-search-plus"></i></button>
                        <button id="zoomOutBtn" class="bg-gray-100 hover:bg-gray-200 p-2 rounded-lg transition duration-300"><i class="fa fa-search-minus"></i></button>
                        <button id="resetMapBtn" class="bg-gray-100 hover:bg-gray-200 p-2 rounded-lg transition duration-300"><i class="fa fa-refresh"></i></button>
                    </div>
                </div>
                <div id="chinaMap" class="map-container rounded-lg border border-gray-200">地图加载中...</div>
            </div>
            <div class="bg-white rounded-xl p-6 card-shadow">
                <div class="flex justify-between items-center mb-6">
                    <h2 class="text-xl font-bold">详细数据列表</h2>
                    <label class="flex items-center bg-gray-100 rounded-lg px-4 py-2 cursor-pointer transition duration-300">
                        <i class="fa fa-upload mr-2"></i><span>上传新数据</span>
                        <input type="file" id="fileUpload" accept=".xlsx, .xls" class="hidden">
                    </label>
                </div>
                <div class="overflow-x-auto">
                    <table class="min-w-full divide-y divide-gray-200">
                        <thead class="bg-gray-50">
                            <tr>
                                <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">城市</th>
                                <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500">中心名称</th>
                                <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500">总入组</th>
                                <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500">今日入组</th>
                                <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500">警报信息</th>
                            </tr>
                        </thead>
                        <tbody id="dataTableBody" class="bg-white divide-y divide-gray-200">
                            <tr class="text-center"><td colspan="5" class="px-6 py-4 text-gray-500"><i class="fa fa-spinner fa-spin mr-2"></i>加载数据中...</td></tr>
                        </tbody>
                    </table>
                </div>
                <div class="mt-6 flex justify-end">
                    <button id="exportExcelBtn" class="bg-success hover:bg-success/90 text-white px-4 py-2 rounded-lg flex items-center transition duration-300">
                        <i class="fa fa-download mr-2"></i><span>导出当前数据</span>
                    </button>
                </div>
            </div>
        </div>
    </main>
    <!-- 帮助弹窗 -->
    <div id="helpModal" class="fixed inset-0 bg-black/50 flex items-center justify-center z-50 hidden">
        <div class="bg-white rounded-xl p-8 max-w-2xl w-full max-h-[80vh] overflow-y-auto">
            <div class="flex justify-between items-start mb-6">
                <h3 class="text-2xl font-bold">使用帮助</h3>
                <button id="closeHelpModal" class="text-gray-500 hover:text-gray-700"><i class="fa fa-times text-xl"></i></button>
            </div>
            <div class="space-y-6">
                <div>
                    <h4 class="text-lg font-semibold mb-2">1. 城市映射省份</h4>
                    <p class="text-gray-600">表格城市自动匹配省份，地图按省份汇总所有中心数据。</p>
                </div>
                <div>
                    <h4 class="text-lg font-semibold mb-2">2. Excel上传</h4>
                    <p class="text-gray-600">支持表头「城市」或者「地点」，文件格式 xlsx/xls。</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        let myChart = null;
        let currentData = [];
        let chinaGeo = null;

        // 城市 → 简称省份映射
        const cityToProvince = {
            "北京": "北京","上海": "上海","天津": "天津","重庆": "重庆",
            "长沙": "湖南","株洲": "湖南","湘潭": "湖南","衡阳": "湖南","岳阳": "湖南","常德": "湖南",
            "桂林": "广西","南宁": "广西","柳州": "广西","梧州": "广西",
            "广州": "广东","深圳": "广东","佛山": "广东","东莞": "广东","珠海": "广东",
            "武汉": "湖北","宜昌": "湖北","襄阳": "湖北",
            "郑州": "河南","洛阳": "河南","开封": "河南",
            "石家庄": "河北","唐山": "河北","保定": "河北",
            "济南": "山东","青岛": "山东","烟台": "山东",
            "南京": "江苏","苏州": "江苏","无锡": "江苏","徐州": "江苏",
            "杭州": "浙江","宁波": "浙江","温州": "浙江",
            "成都": "四川","绵阳": "四川",
            "西安": "陕西","宝鸡": "陕西"
        };

        // 【关键修复】地图全称 → 简称对照表（匹配阿里云GeoJSON）
        const fullNameToShort = {
            "北京市":"北京","天津市":"天津","上海市":"上海","重庆市":"重庆",
            "河北省":"河北","山西省":"山西","辽宁省":"辽宁","吉林省":"吉林","黑龙江省":"黑龙江",
            "江苏省":"江苏","浙江省":"浙江","安徽省":"安徽","福建省":"福建","江西省":"江西","山东省":"山东",
            "河南省":"河南","湖北省":"湖北","湖南省":"湖南","广东省":"广东","海南省":"海南",
            "四川省":"四川","贵州省":"贵州","云南省":"云南","陕西省":"陕西","甘肃省":"甘肃","青海省":"青海","台湾省":"台湾",
            "内蒙古自治区":"内蒙古","广西壮族自治区":"广西","宁夏回族自治区":"宁夏","新疆维吾尔自治区":"新疆","西藏自治区":"西藏",
            "香港特别行政区":"香港","澳门特别行政区":"澳门"
        };

        // DOM加载完成立刻渲染表格，不等待地图
        document.addEventListener('DOMContentLoaded', function() {
            loadInitialData();
            bindEvents();
            loadChinaMapGeo(); // 异步后台加载地图
        });

        // 拉取标准全国地图
        async function loadChinaMapGeo() {
            try {
                const res = await fetch("https://geo.datav.aliyun.com/areas_v3/bound/100000_full.json");
                chinaGeo = await res.json();
                echarts.registerMap("china", chinaGeo);
                initMap();
                updateMapData();
            } catch (err) {
                console.warn("地图加载失败：", err);
                document.getElementById("chinaMap").innerText = "地图网络加载缓慢，表格可正常使用";
            }
        }

        function initMap() {
            myChart = echarts.init(document.getElementById('chinaMap'));
            const option = {
                tooltip: {
                    trigger: 'item',
                    formatter: function(params) {
                        // 转换地图全名为简称
                        const fullProv = params.name;
                        const shortProv = fullNameToShort[fullProv] || fullProv;
                        const pd = getProvinceData(shortProv);
                        // 空数据兜底文字
                        return `
                            <div class="font-semibold mb-1">${fullProv}</div>
                            ${pd.centerCount === 0 ? '<div class="text-gray-400">暂无统计数据</div>' : `
                            <div class="text-sm">省内中心总数: ${pd.centerCount}</div>
                            <div class="text-sm">全省总入组: ${pd.totalEnrollment}</div>
                            <div class="text-sm">全省今日入组: ${pd.todayEnrollment}</div>
                            <div class="text-sm ${pd.alertCount>0?'text-red-500':''}>待处理警报: ${pd.alertCount}</div>
                            `}
                        `;
                    }
                },
                visualMap: {
                    min: 0, max: 100, left: 'left', top: 'bottom', text: ['高','低'], calculable: true,
                    inRange: {color: ['#e0f7fa','#b2ebf2','#80deea','#4dd0e1','#26c6da','#00bcd4','#00acc1','#0097a7']}
                },
                series: [{
                    name:'省份数据分布',
                    type:'map',
                    mapType:'china',
                    roam:true,
                    label:{show:true,fontSize:12},
                    data:[],
                    emphasis:{label:{color:'#fff',fontSize:14},itemStyle:{areaColor:'#165DFF'}}
                }]
            };
            myChart.setOption(option);
            window.addEventListener('resize', ()=>myChart.resize());
        }

        // 初始示例数据（湖南、广西有数据）
        function loadInitialData() {
            currentData = [
                {"城市":"株洲","中心名称":"株洲市中心医院","总入组":100,"今日入组":5,"警报信息":"无"},
                {"城市":"长沙","中心名称":"湘雅医院","总入组":320,"今日入组":12,"警报信息":"无"},
                {"城市":"桂林","中心名称":"桂林医学院","总入组":200,"今日入组":5,"警报信息":"样本缺失"}
            ];
            updateSummaryCards();
            updateDataTable();
        }

        // 更新顶部统计数字
        function updateSummaryCards() {
            const totalCenters = currentData.length;
            const totalEnrollment = currentData.reduce((s,i)=>s+i['总入组'],0);
            const todayEnrollment = currentData.reduce((s,i)=>s+i['今日入组'],0);
            const alertCount = currentData.filter(i=>i['警报信息']&&i['警报信息']!=='无').length;
            document.getElementById('totalCenters').textContent = totalCenters;
            document.getElementById('totalEnrollment').textContent = totalEnrollment.toLocaleString();
            document.getElementById('todayEnrollment').textContent = todayEnrollment.toLocaleString();
            document.getElementById('alertCount').textContent = alertCount;
        }

        // 更新表格
        function updateDataTable() {
            const tbody = document.getElementById('dataTableBody');
            tbody.innerHTML = '';
            if(currentData.length===0){
                tbody.innerHTML = `<tr class="text-center"><td colspan="5" class="px-6 py-4 text-gray-500"><i class="fa fa-info-circle mr-2"></i>暂无城市数据</td>`;
                return;
            }
            currentData.forEach((item,idx)=>{
                const tr = document.createElement('tr');
                tr.className = idx%2===0?'bg-white':'bg-gray-50';
                tr.innerHTML = `
                    <td class="px-6 py-4 whitespace-nowrap">${item['城市']}</td>
                    <td class="px-6 py-4 whitespace-nowrap">${item['中心名称']}</td>
                    <td class="px-6 py-4 whitespace-nowrap font-medium">${item['总入组']}</td>
                    <td class="px-6 py-4 whitespace-nowrap font-medium ${item['今日入组']>0?'text-success':''}">${item['今日入组']}</td>
                    <td class="px-6 py-4 whitespace-nowrap">
                        <span class="px-2 py-1 rounded-full text-xs ${item['警报信息']==='无'?'bg-success/10 text-success':'bg-danger/10 text-danger'}">
                            ${item['警报信息']==='无'?'<i class="fa fa-check-circle mr-1"></i>正常':'<i class="fa fa-exclamation-circle mr-1"></i>'+item['警报信息']}
                        </span>
                    </td>
                `;
                tbody.appendChild(tr);
            })
        }

        // 更新地图上色数据
        function updateMapData() {
            if(!myChart || !chinaGeo) return;
            const provinceData = {};
            currentData.forEach(item=>{
                const city = item['城市'];
                const province = cityToProvince[city] || '其他';
                if(!provinceData[province]){
                    provinceData[province] = {centerCount:0,totalEnrollment:0,todayEnrollment:0,alertCount:0};
                }
                provinceData[province].centerCount +=1;
                provinceData[province].totalEnrollment += item['总入组'];
                provinceData[province].todayEnrollment += item['今日入组'];
                if(item['警报信息'] && item['警报信息']!=='无') provinceData[province].alertCount +=1;
            })
            // 把简称转回地图全称匹配series
            const mapData = [];
            let maxVal = 0;
            // 遍历全称对照表，匹配数据
            for(const fullName in fullNameToShort){
                const short = fullNameToShort[fullName];
                const val = provinceData[short]?.totalEnrollment || 0;
                mapData.push({name: fullName, value: val});
                if(val>maxVal) maxVal=val;
            }
            const opt = myChart.getOption();
            opt.visualMap[0].max = maxVal>0?maxVal:100;
            opt.series[0].data = mapData;
            myChart.setOption(opt);
        }

        // 根据省份简称获取汇总数据
        function getProvinceData(shortName) {
            const res = {centerCount:0,totalEnrollment:0,todayEnrollment:0,alertCount:0};
            currentData.forEach(item=>{
                const p = cityToProvince[item['城市']] || '其他';
                if(p===shortName){
                    res.centerCount++;
                    res.totalEnrollment += item['总入组'];
                    res.todayEnrollment += item['今日入组'];
                    if(item['警报信息']&&item['警报信息']!=='无') res.alertCount++;
                }
            })
            return res;
        }

        // 绑定所有按钮事件
        function bindEvents() {
            document.getElementById('refreshBtn').addEventListener('click',function(){
                this.innerHTML = '<i class="fa fa-spinner fa-spin mr-2"></i><span>刷新中...</span>';
                this.disabled=true;
                setTimeout(()=>{
                    updateSummaryCards();
                    updateDataTable();
                    updateMapData();
                    this.innerHTML = '<i class="fa fa-refresh mr-2"></i><span>刷新数据</span>';
                    this.disabled=false;
                    showToast('数据刷新完成','success');
                },800)
            })
            document.getElementById('zoomInBtn').onclick = ()=>myChart&&myChart.dispatchAction({type:'zoom',scale:1.2});
            document.getElementById('zoomOutBtn').onclick = ()=>myChart&&myChart.dispatchAction({type:'zoom',scale:0.8});
            document.getElementById('resetMapBtn').onclick = ()=>myChart&&myChart.dispatchAction({type:'restore'});
            document.getElementById('dataTypeSelect').addEventListener('change',updateMapData);

            // Excel上传解析
            document.getElementById('fileUpload').addEventListener('change',e=>{
                const file = e.target.files[0];
                if(!file) return;
                if(!/\.(xlsx|xls)$/.test(file.name)){ showToast('仅支持xlsx/xls','error');return; }
                const reader = new FileReader();
                reader.onload = function(ev){
                    try{
                        const buf = new Uint8Array(ev.target.result);
                        const wb = XLSX.read(buf,{type:'array'});
                        const sheet = wb.Sheets[wb.SheetNames[0]];
                        let json = XLSX.utils.sheet_to_json(sheet);
                        if(json.length===0){showToast('表格无数据','warning');return;}
                        json = json.map(row=>{
                            const r = {...row};
                            if(r['地点'] && !r['城市']) r['城市'] = r['地点'];
                            return r;
                        })
                        const need = ['城市','中心名称','总入组','今日入组','警报信息'];
                        if(!need.every(k=>Object.keys(json[0]).includes(k))){
                            showToast('表格缺少必填字段','error');return;
                        }
                        json.forEach(i=>{
                            i['总入组'] = parseInt(i['总入组'])||0;
                            i['今日入组'] = parseInt(i['总入组'])||0;
                            i['警报信息'] = i['警报信息']||'无';
                        })
                        currentData = json;
                        updateSummaryCards();
                        updateDataTable();
                        updateMapData();
                        e.target.value = '';
                        showToast(`导入${json.length}条数据`,'success');
                    }catch(err){ showToast('读取表格失败','error'); }
                }
                reader.readAsArrayBuffer(file);
            })

            // 导出Excel
            document.getElementById('exportExcelBtn').onclick = function(){
                if(currentData.length===0) return showToast('暂无数据','warning');
                const sheet = XLSX.utils.json_to_sheet(currentData);
                const wb = XLSX.utils.book_new();
                XLSX.utils.book_append_sheet(wb,"城市明细");
                const d = new Date();
                const fname = `城市数据_${d.getFullYear()}${(d.getMonth()+1).padStart(2,'0')}${d.getDate().padStart(2,'0')}`;
                XLSX.writeFile(wb,fname+".xlsx");
                showToast('导出完成','success');
            }

            document.getElementById('helpBtn').onclick = ()=>document.getElementById('helpModal').classList.remove('hidden');
            document.getElementById('closeHelpModal').onclick = ()=>document.getElementById('helpModal').classList.add('hidden');
            document.getElementById('helpModal').addEventListener('click',ev=>{
                if(ev.target === document.getElementById('helpModal')) document.getElementById('helpModal').classList.add('hidden');
            })
        }

        // 提示弹窗
        function showToast(msg,type='info'){
            const div = document.createElement('div');
            let bg = 'bg-gray-800',icon='fa-info-circle';
            if(type==='success'){bg='bg-success';icon='fa-check-circle';}
            if(type==='error'){bg='bg-danger';icon='fa-exclamation-circle';}
            if(type==='warning'){bg='bg-warning';icon='fa-exclamation-triangle';}
            div.className = `${bg} text-white px-4 py-3 rounded-lg shadow-lg fixed bottom-6 right-6 z-50 flex items-center transition-all duration-300 transform translate-y-20 opacity-0`;
            div.innerHTML = `<i class="fa ${icon} mr-2"></i><span>${msg}</span>`;
            document.body.appendChild(div);
            setTimeout(()=>div.classList.remove('translate-y-20','opacity-0'),10);
            setTimeout(()=>{div.classList.add('translate-y-20','opacity-0');setTimeout(()=>div.remove(),3000);},3000)
        }
    </script>
</body>
</html>
